name: Unpack HR RIDE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          pwd
          ls -la
          test -f ./HR_RIDE.zip

      - name: Unzip HR RIDE project
        run: |
          unzip -o ./HR_RIDE.zip -d ./hr_ride_extracted
          cp -a ./hr_ride_extracted/. .
          rm -rf ./hr_ride_extracted
          rm -f ./HR_RIDE.zip

      - name: Check Flutter project
        run: |
          test -f pubspec.yaml
          test -d lib
          echo "HR RIDE Flutter project extracted successfully"

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract HR RIDE Flutter project"
          git push
