name: Prepare HR RIDE project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack HR RIDE ZIP
        run: |
          test -f HR_RIDE.zip
          mkdir -p /tmp/hr_ride
          unzip -q HR_RIDE.zip -d /tmp/hr_ride
          cp -a /tmp/hr_ride/. .
          rm -f HR_RIDE.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Prepare HR RIDE Flutter project"
          git push
