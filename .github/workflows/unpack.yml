name: Unpack HR RIDE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip HR RIDE project
        run: |
          unzip -o HR_RIDE.zip -d extracted
          cp -r extracted/*/. .
          find extracted -mindepth 1 -maxdepth 1 -type d -exec cp -r {}/* . \; || true
          rm -rf extracted
          rm -f HR_RIDE.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract HR RIDE Flutter project"
          git push
