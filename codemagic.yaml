workflows:
  hr-ride-android:
    name: HR RIDE Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Generate Android project
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.hrride

      - name: Configure Firebase
        script: |
          cp app/google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          app = Path("android/app/build.gradle")
          if not app.exists():
              app = Path("android/app/build.gradle.kts")

          text = app.read_text()

          text = text.replace(
              'applicationId "com.hrride.hr_ride"',
              'applicationId "com.hrride.app"'
          )
          text = text.replace(
              'applicationId = "com.hrride.hr_ride"',
              'applicationId = "com.hrride.app"'
          )

          app.write_text(text)

          settings = Path("android/settings.gradle")
          if not settings.exists():
              settings = Path("android/settings.gradle.kts")

          text = settings.read_text()

          if "com.google.gms.google-services" not in text:
              if settings.suffix == ".kts":
                  text = text.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                      1
                  )
              else:
                  text = text.replace(
                      "plugins {",
                      'plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                      1
                  )

          settings.write_text(text)
          PY

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

      - name: Sign APK
        script: |
          keytool -genkeypair \
            -v \
            -keystore hr-ride-release.keystore \
            -alias hr-ride \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass hrride123 \
            -keypass hrride123 \
            -dname "CN=HR RIDE, OU=HR RIDE, O=HR RIDE, L=Kolkata, ST=West Bengal, C=IN"

          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | head -1)

          "$APKSIGNER" sign \
            --ks hr-ride-release.keystore \
            --ks-key-alias hr-ride \
            --ks-pass pass:hrride123 \
            --key-pass pass:hrride123 \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Get APK SHA
        script: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
