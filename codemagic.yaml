workflows:
  hr-ride-android:
    name: HR RIDE Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:

      - name: Generate Android project
        script: |
          rm -rf android

          flutter create . \
            --platforms=android \
            --org com.hrride

          echo "===== Adding Firebase configuration ====="

          cp app/google-services.json android/app/google-services.json

          echo "===== Updating application ID ====="

          sed -i.bak \
            's/applicationId "com.hrride.hr_ride"/applicationId "com.hrride.app"/' \
            android/app/build.gradle

          rm -f android/app/build.gradle.bak

          echo "===== Adding Google Services plugin ====="

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          text = settings.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                  1
              )

          settings.write_text(text)

          app_gradle = Path("android/app/build.gradle")
          text = app_gradle.read_text()

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id "com.google.gms.google-services"',
                  1
              )

          app_gradle.write_text(text)
          PY

          echo "===== Android Firebase files ====="
          ls -la android/app/
          test -f android/app/google-services.json

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
