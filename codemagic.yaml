workflows:
  hr-ride-android:
    name: HR RIDE Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:

      - name: Generate Android project
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.hrride

      - name: Configure Firebase
        script: |
          cp app/google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          gradle_files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          app_gradle = next((p for p in gradle_files if p.exists()), None)

          if app_gradle is None:
              raise FileNotFoundError("Android app Gradle file not found")

          text = app_gradle.read_text()

          text = text.replace(
              'applicationId "com.hrride.hr_ride"',
              'applicationId "com.hrride.app"'
          )

          text = text.replace(
              'applicationId = "com.hrride.hr_ride"',
              'applicationId = "com.hrride.app"'
          )

          if app_gradle.suffix == ".kts":
              if 'com.google.gms.google-services' not in text:
                  text = text.replace(
                      'plugins {',
                      'plugins {\n    id("com.google.gms.google-services")',
                      1
                  )
          else:
              if 'com.google.gms.google-services' not in text:
                  text = text.replace(
                      'plugins {',
                      'plugins {\n    id "com.google.gms.google-services"',
                      1
                  )

          app_gradle.write_text(text)

          settings_files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts")
          ]

          settings = next((p for p in settings_files if p.exists()), None)

          if settings is None:
              raise FileNotFoundError(
                  "Android settings Gradle file not found"
              )

          text = settings.read_text()

          if 'com.google.gms.google-services' not in text:
              if settings.suffix == ".kts":
                  text = text.replace(
                      'plugins {',
                      'plugins {\n'
                      '    id("com.google.gms.google-services") '
                      'version "4.4.2" apply false',
                      1
                  )
              else:
                  text = text.replace(
                      'plugins {',
                      'plugins {\n'
                      '    id "com.google.gms.google-services" '
                      'version "4.4.2" apply false',
                      1
                  )

          settings.write_text(text)
          PY

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

      - name: Get APK SHA
        script: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
