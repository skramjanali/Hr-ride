workflows:
  hr-ride-android:
    name: HR RIDE Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:

      - name: Generate Android project
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.hrride

      - name: Configure Firebase
        script: |
          cp app/google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          # Set correct package ID
          p = Path("android/app/build.gradle")
          text = p.read_text()
          text = text.replace(
              'applicationId "com.hrride.hr_ride"',
              'applicationId "com.hrride.app"'
          )

          # Add Google Services plugin to app
          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  'plugins {',
                  'plugins {\n    id "com.google.gms.google-services"',
                  1
              )

          p.write_text(text)

          # Add Google Services plugin version to settings
          p = Path("android/settings.gradle")
          text = p.read_text()

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  'plugins {',
                  'plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                  1
              )

          p.write_text(text)
          PY

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
