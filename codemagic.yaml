workflows:
  hr-ride-android:
    name: HR RIDE Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      android_signing:
        - hr-ride-release
      flutter: stable

    scripts:
      - name: Generate Android project
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.hrride
      - name: Configure Location Permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = """
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
          <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
          """

          if "android.permission.ACCESS_BACKGROUND_LOCATION" not in text:
              text = text.replace(
                  "</manifest>",
                  permissions + "\n</manifest>"
              )

          manifest.write_text(text)
          PY
      - name: Configure Firebase
        script: |
          cp app/google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          # Configure app module
          app = Path("android/app/build.gradle")
          if not app.exists():
              app = Path("android/app/build.gradle.kts")

          text = app.read_text()

          text = text.replace(
              'applicationId "com.hrride.hr_ride"',
              'applicationId "com.hrride.app"'
          )

          text = text.replace(
              'applicationId = "com.hrride.hr_ride"',
              'applicationId = "com.hrride.app"'
          )

          # Apply Google Services plugin to app module
          if app.suffix == ".kts":
              if 'id("com.google.gms.google-services")' not in text:
                  text = text.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services")',
                      1
                  )
          else:
              if "com.google.gms.google-services" not in text:
                  text = text.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1
                  )

          app.write_text(text)

          # Configure project-level Google Services plugin
          settings = Path("android/settings.gradle")
          if not settings.exists():
              settings = Path("android/settings.gradle.kts")

          text = settings.read_text()

          if "com.google.gms.google-services" not in text:
              if settings.suffix == ".kts":
                  text = text.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                      1
                  )
              else:
                  text = text.replace(
                      "plugins {",
                      'plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                      1
                  )

          settings.write_text(text)
          PY

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

      - name: Sign APK
        script: |
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | head -1)

          "$APKSIGNER" sign \
            --ks "$CM_KEYSTORE_PATH" \
            --ks-key-alias "$CM_KEY_ALIAS" \
            --ks-pass env:CM_KEYSTORE_PASSWORD \
            --key-pass env:CM_KEY_PASSWORD \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Get APK SHA
        script: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
