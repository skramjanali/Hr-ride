workflows:
  hr-ride-android:
    name: HR RIDE Android AAB
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      android_signing:
        - hr-ride-release
      flutter: stable

    scripts:

      # ==========================================================
      # 1. Backup Firebase configuration
      # ==========================================================
      - name: Backup Firebase configuration
        script: |
          set -e

          mkdir -p /tmp/hr_ride_backup

          if [ -f "android/app/google-services.json" ]; then
            cp "android/app/google-services.json" \
              "/tmp/hr_ride_backup/google-services.json"

            echo "Firebase configuration backed up."
          else
            echo "WARNING: google-services.json not found."
          fi

      # ==========================================================
      # 2. Generate Android project
      # ==========================================================
      - name: Generate Android project
        script: |
          set -e

          rm -rf android

          flutter create . \
            --platforms=android \
            --org com.hrride

      # ==========================================================
      # 3. Restore Firebase configuration
      # ==========================================================
      - name: Restore Firebase configuration
        script: |
          set -e

          if [ -f "/tmp/hr_ride_backup/google-services.json" ]; then
            mkdir -p android/app

            cp "/tmp/hr_ride_backup/google-services.json" \
              "android/app/google-services.json"

            echo "Firebase configuration restored."
          else
            echo "WARNING: Firebase configuration not available."
          fi

      # ==========================================================
      # 4. Configure Location Permissions
      # ==========================================================
      - name: Configure Location Permissions
        script: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permissions = """
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
          <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
          """

          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              text = text.replace(
                  "</manifest>",
                  permissions + "\n</manifest>"
              )

          manifest.write_text(text)

          print("Location permissions configured.")
          PY

      # ==========================================================
      # 5. Get Flutter packages
      # ==========================================================
      - name: Get packages
        script: |
          set -e

          flutter pub get

      # ==========================================================
      # 6. Flutter analyze
      # ==========================================================
      - name: Flutter analyze
        script: |
          set +e

          flutter analyze

          echo "Flutter analyze completed."

          exit 0

      # ==========================================================
      # 7. Build Android App Bundle
      # ==========================================================
      - name: Build AAB
        script: |
          set -e

          echo "=========================================="
          echo "Building HR RIDE Android App Bundle..."
          echo "=========================================="

          flutter build appbundle --release

          echo "=========================================="
          echo "AAB BUILD COMMAND COMPLETED"
          echo "=========================================="

      # ==========================================================
      # 8. Verify AAB file
      # ==========================================================
      - name: Verify AAB
        script: |
          set -e

          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"

          echo "Checking AAB..."

          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: AAB file was NOT created."
            echo ""
            echo "Expected:"
            echo "$AAB_PATH"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "HR RIDE AAB CREATED SUCCESSFULLY"
          echo "=========================================="
          echo ""

          ls -lh "$AAB_PATH"

          echo ""
          echo "AAB path:"
          echo "$AAB_PATH"

    # ============================================================
    # AAB Artifact
    # ============================================================
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
